name: Assemble verified VyseTV backup
on:
  push:
    paths:
      - '.release-staging/vysetv-1.0.1/**'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.release-staging/vysetv-1.0.1/
            /apps.json
            /apks/entertainment/streaming/
      - name: Assemble and verify original APK
        shell: bash
        run: |
          set -euo pipefail
          stage=.release-staging/vysetv-1.0.1
          test -f "$stage/part0"
          test -f "$stage/part1"
          mkdir -p apks/entertainment/streaming
          cat "$stage/part0" "$stage/part1" > apks/entertainment/streaming/StreamingServices-VyseTV-1.0.1.apk
          echo '5b84db480e253b7b1bb803b21a4361d88524ab16edec3cfabbe70746bf6b724e  apks/entertainment/streaming/StreamingServices-VyseTV-1.0.1.apk' | sha256sum -c -
          python3 - <<'PYCODE'
          import json,pathlib
          p=pathlib.Path('apps.json')
          apps=json.loads(p.read_text())
          entry=json.loads(pathlib.Path('.release-staging/vysetv-1.0.1/entry.json').read_text())
          apps=[x for x in apps if x.get('packageName') != entry['packageName']]
          apps.append(entry)
          p.write_text(json.dumps(apps,indent=2)+'\n')
          PYCODE
          rm "$stage/part0" "$stage/part1"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps.json apks/entertainment/streaming/StreamingServices-VyseTV-1.0.1.apk .release-staging/vysetv-1.0.1
          git commit -m 'Publish Streaming Services in Entertainment Streaming'
          git push origin HEAD:main
